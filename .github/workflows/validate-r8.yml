
name: Validate R8 Configuration

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Check resolved Expo R8 settings
        run: |
          node <<'NODE'
          const config = require('./app.json').expo;
          const plugin = config.plugins.find(
            (item) => Array.isArray(item) && item[0] === 'expo-build-properties'
          );

          if (!plugin) {
            throw new Error('expo-build-properties plugin not found');
          }

          const android = plugin[1]?.android ?? {};

          console.log('Minify:', android.enableMinifyInReleaseBuilds);
          console.log('Resource shrinking:', android.enableShrinkResourcesInReleaseBuilds);

          if (android.enableMinifyInReleaseBuilds !== true) {
            throw new Error('R8 minification is not enabled');
          }

          if (android.enableShrinkResourcesInReleaseBuilds !== true) {
            throw new Error('Resource shrinking is not enabled');
          }

          console.log('Both R8 settings are enabled.');
          NODE
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Inspect generated Android release configuration
        run: |
          set -eu

          echo "===== Gradle Properties ====="
          grep -n -E 'android.enableMinifyInReleaseBuilds|android.enableShrinkResourcesInReleaseBuilds' android/gradle.properties || true
          echo "===== Optimized Resource Shrinking ====="
          grep -n '^android.r8.optimizedResourceShrinking=true$' android/gradle.properties
          echo "===== Generated Build Gradle Settings ====="
          echo "===== Portrait Hardware Feature ====="
          grep -n -A 2 -B 2 'android.hardware.screen.portrait' android/app/src/main/AndroidManifest.xml
          grep -n -C 8 -E 'buildTypes|release|isMinifyEnabled|minifyEnabled|shrinkResources|proguardFiles|proguard-android' android/app/build.gradle || true

          echo "===== Generated ProGuard/R8 Files ====="
          find android -type f \( -iname '*proguard*' -o -iname '*r8*' \) -print

          echo "===== ProGuard/R8 Rules ====="
          find android -type f \( -iname '*proguard*.pro' -o -iname '*r8*.pro' \) -exec sh -c '
            for file do
              echo "--- $file ---"
              sed -n "1,240p" "$file"
            done
          ' sh {} +

          echo "===== Android Gradle Plugin Version ====="
          grep -n -E 'com.android.tools.build:gradle|com.android.application|com.android.library' android/build.gradle android/settings.gradle android/gradle/libs.versions.toml 2>/dev/null || true
