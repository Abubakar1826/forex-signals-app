
name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Check Expo IAP version
        run: |
          npm ls expo-iap
          node -p "require('expo-iap/package.json').version"

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify Google Play Billing permission
        run: |
          grep -q 'com.android.vending.BILLING' android/app/src/main/AndroidManifest.xml
          echo "Google Play Billing permission found."

      
      - name: Configure original Google Play upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking required GitHub Secrets..."
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing Base64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing keystore password"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing key alias"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing key password"; exit 1; }

          echo "Decoding keystore..."
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

          echo "Checking keystore file..."
          test -s android/app/upload-keystore.jks || { echo "Keystore file is empty"; exit 1; }
          file android/app/upload-keystore.jks

          echo "Verifying keystore password and alias..."
          if keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "Keystore password and alias verified."
          else
            echo "Keystore verification failed. Check the saved password and alias against the EAS credentials file."
            exit 1
          fi

          
          echo "Adding signing configuration directly to app/build.gradle..."
          cat >> android/app/build.gradle <<'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file("upload-keystore.jks")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE

          echo "Signing configuration added."



      - name: Build Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew app:bundleRelease

      - name: Verify AAB upload-key fingerprint
        run: |
          set -euo pipefail

          AAB="android/app/build/outputs/bundle/release/app-release.aab"

          test -f "$AAB"
          jarsigner -verify "$AAB"

          ACTUAL=$(keytool -printcert -jarfile "$AAB" \
            | awk -F': ' '/SHA1:/{print $2; exit}' \
            | tr -d '[:space:]' \
            | tr '[:lower:]' '[:upper:]')

          EXPECTED="CBEE34CD1EDC214C0BDFB4F381C3A6BD7F6AC625"

          echo "Detected AAB SHA1: $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::AAB upload-key fingerprint does not match the original Play Console key."
            exit 1
          fi

          echo "Original Google Play upload-key verified."

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: forex-signals-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
