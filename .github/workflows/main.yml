name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm install
      - name: Check Expo IAP version
        run: npm ls expo-iap && node -p "require('expo-iap/package.json').version"
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify Google Play Billing permission
        run: |
          grep -q 'com.android.vending.BILLING' android/app/src/main/AndroidManifest.xml
          echo "Google Play Billing permission found."
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forex-signals-apk
          path: android/app/build/outputs/apk/release/app-release.apk 
